{% extends 'base.html' %}

{% block content %}
<div class="container">
<form method="post">
    <h2>Editar ou Adicionar Novo Contato</h2>
    {% csrf_token %}

    <div class="form-group">
    <label for="id_nome">Nome</label><br>
    {{ form.nome }} <br>
    </div>

    <div class="form-group">
    <label for="id_telefone">Telefone</label><br>
    {{ form.telefone }}<br>
    </div>

    <div class="form-group">
    <label for="id_email">E-mail</label><br>
    {{ form.email }}<br>
    </div>

    <div class="form-group">
    <label for="id_resumo">Resumo</label><br>
    {{ form.resumo }}<br>
    </div>


    <br>
    <button class="btn btn-primary" type="submit">Salvar</button>
    <a href="{% url 'Listar_contatos' %}" class="btn btn-secondary">Cancelar</a>
</form>
</div>
{% endblock %}
